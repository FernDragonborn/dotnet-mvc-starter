# Drop into /etc/nginx/conf.d/ via docker-compose volume mount.
# Replace api.example.com with your domain and provision certs via certbot.

# Rate-limit zones (10 MB ≈ 160k IPs each)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=10r/m;

upstream backend {
    server backend:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.example.com;

    # Allow ACME http-01 challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # TLS — provision real certs (Let's Encrypt) and mount /etc/letsencrypt
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Forward real client info downstream
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Sensible default; per-location override below for uploads
    client_max_body_size 1m;

    # Anti brute-force on auth endpoints
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }

    # Avatar upload — 5 MB cap + multipart overhead
    location /api/profiles/me/redactpfp {
        limit_req zone=api_upload burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://backend;
    }

    # Health probe — bypass throttling, skip access log
    location = /health/live {
        access_log off;
        proxy_pass http://backend;
    }

    # Everything else
    location / {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }
}
